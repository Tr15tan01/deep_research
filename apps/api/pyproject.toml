[project]
name = "deep-research-api"
version = "0.1.0"
description = "Deep Research Agent — FastAPI backend, research engine and worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pymongo>=4.13",          # official async driver (AsyncMongoClient)
  "redis>=5.2",
  "fakeredis>=2.26",       # REDIS_URL=memory:// (single-process hosting)
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "httpx>=0.28,<0.29",
  "structlog>=24.4",
  "langgraph>=1.0,<2",
  "trafilatura>=2.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.18",
  "aiosmtplib>=3.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
tracking = ["sentry-sdk>=2.0"]  # enables ERROR_TRACKING_DSN
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "mongomock-motor>=0.0.35",
  "motor>=3.6",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: requires real external credentials (skipped unless LIVE_TESTS=1)",
  "redis: requires a running redis-server binary",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# S110: deliberate best-effort paths (metrics, caches, pub/sub) must never break the primary action.
# ASYNC109: explicit timeout parameters are part of these APIs' contracts.
ignore = ["E501", "S101", "B008", "S311", "UP042", "S110", "ASYNC109", "ASYNC240", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S603", "S607", "B017", "ASYNC220"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["app", "deep_research_worker", "tests"]
